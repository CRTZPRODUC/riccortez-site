<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja · Ric Cortez Pickups</title>
  <meta name="description" content="Todos os produtos Ric Cortez: captadores, interfaces de áudio, microfones, kits e acessórios.">
  <meta name="theme-color" content="#0a0a0a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Loja · Ric Cortez Pickups">
  <meta property="og:description" content="Captadores, interfaces de áudio, microfones, kits e acessórios.">
  <meta property="og:image" content="https://riccortez.com/assets/img/og-share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="pt_BR">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-style='italic' font-size='20' text-anchor='middle' fill='%23d4a437'%3ER%3C/text%3E%3C/svg%3E">
  <script>try{var t=localStorage.getItem('rc-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script type="module" src="assets/js/shop.js"></script>
</head>
<body>
  <div data-header></div>

  <main id="main" tabindex="-1">
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Você está em" data-crumbs>
          <a href="index.html">Início</a>
          <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          <span aria-current="page">Loja</span>
        </nav>
        <h1 class="page-title" data-title>Loja</h1>
        <p class="page-sub" data-sub>Captadores, interfaces de áudio, microfones, kits e acessórios.</p>
      </div>
    </section>

    <div class="container catalog">
      <aside class="filters" id="filters" aria-label="Filtros">
        <div class="filters-head">
          <h2>Filtros</h2>
          <button class="icon-btn" type="button" data-close aria-label="Fechar filtros"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="filter-group">
          <h3 class="filter-title">Categorias</h3>
          <div data-cat-filters></div>
        </div>
        <div class="filter-group">
          <h3 class="filter-title">Mostrar</h3>
          <label class="check-row"><input type="checkbox" data-opt="stock"> Somente disponíveis</label>
          <label class="check-row"><input type="checkbox" data-opt="sale"> Em oferta</label>
        </div>
        <button class="btn btn-ghost btn-block" type="button" data-clear>Limpar filtros</button>
      </aside>

      <section aria-labelledby="results-label">
        <h2 class="sr-only" id="results-label">Resultados</h2>
        <div class="toolbar">
          <div class="toolbar-left">
            <button class="btn btn-ghost filter-toggle" type="button" data-open-filters aria-controls="filters">
              <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/></svg> Filtros
            </button>
            <p class="result-count" aria-live="polite" data-count></p>
          </div>
          <form class="search-pill shop-search" role="search" data-shop-search>
            <label class="sr-only" for="shop-q">Buscar na loja</label>
            <input id="shop-q" name="q" type="search" placeholder="Buscar na loja" autocomplete="off">
            <button type="submit" aria-label="Buscar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
          </form>
          <div class="select-wrap">
            <label class="sr-only" for="sort">Ordenar por</label>
            <select id="sort" data-sort>
              <option value="rel">Relevância</option>
              <option value="asc">Menor preço</option>
              <option value="desc">Maior preço</option>
              <option value="new">Novidades</option>
            </select>
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
        <div class="chips" data-chips></div>
        <div class="products-grid" data-grid></div>
      </section>
    </div>
  </main>

  <div data-footer></div>
</body>
</html>
